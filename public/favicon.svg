<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="favicon-circle">
      <circle cx="32" cy="32" r="20" />
    </clipPath>
    <linearGradient id="favicon-ring" x1="12" x2="52" y1="12" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="24" fill="url(#favicon-ring)" />
  <circle cx="32" cy="32" r="20.5" fill="#f8fffc" />
  <image
    href="/logo.png"
    x="12"
    y="12"
    width="40"
    height="40"
    preserveAspectRatio="xMidYMid meet"
    clip-path="url(#favicon-circle)"
  />
</svg>
